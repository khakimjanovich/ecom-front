# Every push: types from the ecom contract, lint, unit tests and a production build.
# The end-to-end journey (pnpm e2e) needs the whole stack, so it runs locally; see README.
name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
